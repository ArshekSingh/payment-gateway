spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/payment_gateway?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000

gateway:
  # No default in prod: the app refuses to start without it.
  admin-api-key: ${GATEWAY_ADMIN_API_KEY}
  webhook:
    allow-private-targets: false
