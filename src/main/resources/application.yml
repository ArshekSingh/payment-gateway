spring:
  application:
    name: payment-gateway
  datasource:
    # Local default: in-memory H2 in MySQL mode. Use the "prod" profile for MySQL.
    url: jdbc:h2:mem:paymentgateway;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  provider: simulated
  # Static key for /admin/** endpoints. Override via GATEWAY_ADMIN_API_KEY. Blank disables admin API.
  admin-api-key: ${GATEWAY_ADMIN_API_KEY:dev-admin-key-change-me}
  max-amount: 99999999
  webhook:
    dispatcher-enabled: true
    poll-interval-ms: 5000
    batch-size: 50
    max-attempts: 6
    timeout: 5s
    lease: 2m
    # Allows http:// and private/loopback targets. Keep false outside local development.
    allow-private-targets: ${GATEWAY_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}

logging:
  level:
    com.arshek.paymentgateway: INFO
